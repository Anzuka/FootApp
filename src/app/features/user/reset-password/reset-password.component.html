<div class="new-password-container" *ngIf="!showFeedback">
  <h2>Set New Password</h2>
  <p class="instructions">
    Please enter your new password below and confirm it.
  </p>

  <form [formGroup]="newPasswordForm" (ngSubmit)="onSubmit()">
    <!-- New Password Field -->
    <div class="form-field">
      <label for="newPassword">New Password</label>
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        placeholder="New Password"
      />
      <!-- Error Message for New Password -->
      <div *ngIf="newPasswordForm.get('newPassword')?.invalid && (newPasswordForm.get('newPassword')?.dirty || newPasswordForm.get('newPassword')?.touched)" class="error-message">
        <small *ngIf="newPasswordForm.get('newPassword')?.errors?.['required']">Password is required</small>
        <small *ngIf="newPasswordForm.get('newPassword')?.errors?.['passwordStrength']">
          Password needs at least 7 characters with 1 uppercase, 1 lowercase, 1 number, and 1 special character.
        </small>
      </div>
    </div>

    <!-- Confirm Password Field -->
    <div class="form-field">
      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        placeholder="Confirm Password"
      />
      <!-- Error Message for Confirm Password -->
      <div *ngIf="newPasswordForm.get('confirmPassword')?.invalid && (newPasswordForm.get('confirmPassword')?.dirty || newPasswordForm.get('confirmPassword')?.touched)" class="error-message">
        <small *ngIf="newPasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</small>
      </div>
      <div *ngIf="newPasswordForm.hasError('passwordMismatch') && newPasswordForm.get('confirmPassword')?.dirty" class="error-message">
        <small>Passwords do not match</small>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="newPasswordForm.invalid">Send</button>

    <!-- General Error Message -->
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </form>
</div>

<!-- Feedback Component for Success/Failure Message -->
<app-feedback
  *ngIf="showFeedback"
  [message]="feedbackMessage"
  [isSuccess]="isSuccess"
  [buttonText]="buttonText"
  (buttonClicked)="buttonAction()">
</app-feedback>
