<div class="confirmation-container">
  <h2>Check Your Email</h2>
  <p class="confirmation-message">
    We've just sent you an email with instructions to reset your password.
    Please check your inbox and follow the link to complete the process.
  </p>
  <p class="additional-info">
    If you don't see the email within a few minutes, please check your spam or junk folder.
  </p>
  <button pButton type="button" label="Back to Login" routerLink="/login"></button>
</div>
